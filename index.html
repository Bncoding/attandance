<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart AI Face Attendance & Break Tracker</title>

  <!-- Google Fonts & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg: #090d16;
      --card-bg: rgba(22, 30, 46, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent-primary: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.25);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --purple: #a855f7;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background-color: var(--bg); color: var(--text-main); padding: 1.5rem; min-height: 100vh; }

    /* Header */
    .header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 2rem; border-bottom: 1px solid var(--card-border); padding-bottom: 1rem;
    }
    .header h1 { font-size: 1.6rem; font-weight: 700; background: linear-gradient(135deg, #38bdf8, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    
    .clock-badge {
      background: rgba(255,255,255,0.05); border: 1px solid var(--card-border);
      padding: 0.5rem 1rem; border-radius: 20px; font-weight: 600; font-size: 0.9rem; color: var(--accent-primary);
    }

    /* Main Grid */
    .grid { display: grid; grid-template-columns: 1fr 420px; gap: 1.5rem; }
    @media (max-width: 980px) { .grid { grid-template-columns: 1fr; } }

    /* Camera Viewport */
    .video-card {
      background: var(--card-bg); border: 1px solid var(--card-border);
      border-radius: 16px; padding: 1rem; backdrop-filter: blur(12px);
      display: flex; flex-direction: column; gap: 1rem;
    }

    .video-container {
      position: relative; background: #000; border-radius: 12px;
      overflow: hidden; aspect-ratio: 4/3; box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      border: 2px solid rgba(56, 189, 248, 0.3);
    }
    video, canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }

    /* Panel & Controls */
    .panel {
      background: var(--card-bg); border: 1px solid var(--card-border);
      border-radius: 16px; padding: 1.5rem; backdrop-filter: blur(12px);
      display: flex; flex-direction: column; gap: 1.2rem;
    }

    .section-title { font-size: 1rem; font-weight: 600; color: var(--text-main); display: flex; align-items: center; gap: 0.5rem; }
    
    input, select {
      width: 100%; padding: 0.75rem 1rem; border-radius: 8px;
      border: 1px solid var(--card-border); background: rgba(15, 23, 42, 0.6);
      color: var(--text-main); font-size: 0.9rem; outline: none; transition: all 0.2s;
    }
    input:focus, select:focus { border-color: var(--accent-primary); box-shadow: 0 0 0 3px var(--accent-glow); }

    /* Action Buttons */
    .mode-selector {
      display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem;
    }

    .btn-mode {
      padding: 0.6rem; border-radius: 8px; border: 1px solid var(--card-border);
      background: rgba(255,255,255,0.03); color: var(--text-muted); font-size: 0.82rem;
      font-weight: 600; cursor: pointer; transition: all 0.2s;
    }
    .btn-mode.active { background: var(--accent-primary); color: #000; border-color: var(--accent-primary); }

    button.btn-main {
      width: 100%; padding: 0.85rem; border-radius: 8px; border: none;
      background: linear-gradient(135deg, #38bdf8, #2563eb); color: #fff;
      font-weight: 600; font-size: 0.95rem; cursor: pointer; transition: all 0.2s;
      box-shadow: 0 4px 14px rgba(56, 189, 248, 0.3);
    }
    button.btn-main:hover { opacity: 0.95; transform: translateY(-1px); }
    button:disabled { opacity: 0.4; cursor: not-allowed; transform: none !important; box-shadow: none !important; }

    /* Status Bar */
    .status-box {
      padding: 0.75rem 1rem; border-radius: 8px; font-size: 0.85rem; font-weight: 500;
      text-align: center; background: rgba(255,255,255,0.05); border: 1px solid var(--card-border);
    }
    .status-box.success { background: rgba(16, 185, 129, 0.15); color: var(--success); border-color: var(--success); }
    .status-box.error { background: rgba(239, 68, 68, 0.15); color: var(--danger); border-color: var(--danger); }
    .status-box.info { background: rgba(56, 189, 248, 0.15); color: var(--accent-primary); border-color: var(--accent-primary); }

    /* Report Section */
    .report-card {
      grid-column: 1 / -1; background: var(--card-bg); border: 1px solid var(--card-border);
      border-radius: 16px; padding: 1.5rem; backdrop-filter: blur(12px); margin-top: 1.5rem;
    }

    .filter-bar {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 1rem; margin: 1.2rem 0; align-items: end;
    }

    .table-wrapper { overflow-x: auto; margin-top: 1rem; border-radius: 8px; border: 1px solid var(--card-border); }
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.88rem; }
    th, td { padding: 0.85rem 1rem; border-bottom: 1px solid var(--card-border); }
    th { background: rgba(15, 23, 42, 0.9); color: var(--text-muted); font-weight: 600; }
    
    .badge {
      display: inline-block; padding: 0.25rem 0.6rem; border-radius: 12px;
      font-size: 0.75rem; font-weight: 600;
    }
    .badge-checkin { background: rgba(16, 185, 129, 0.2); color: var(--success); }
    .badge-breakout { background: rgba(245, 158, 11, 0.2); color: var(--warning); }
    .badge-breakin { background: rgba(168, 85, 247, 0.2); color: var(--purple); }
    .badge-checkout { background: rgba(239, 68, 68, 0.2); color: var(--danger); }
  </style>

  <!-- External JS Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
</head>
<body>

  <div class="header">
    <h1>AI Face ID Attendance</h1>
    <div id="clock" class="clock-badge">--:--:--</div>
  </div>

  <div class="grid">
    <!-- Camera View Container -->
    <div class="video-card">
      <div class="video-container" id="videoContainer">
        <video id="webcam" autoplay muted playsinline></video>
      </div>
      <div id="status" class="status-box info">System Initializing...</div>
    </div>

    <!-- Control Operations Panel -->
    <div class="panel">
      <!-- 1. Registration Section -->
      <div class="section-title">👤 Register Employee Face</div>
      <input type="text" id="userName" placeholder="Enter Full Name">
      <button id="btnRegister" class="btn-main" disabled style="background: linear-gradient(135deg, #10b981, #059669);">Register Profile</button>

      <hr style="border-color: var(--card-border);">

      <!-- 2. Attendance & Break Punch Section -->
      <div class="section-title">⏱️ Punch Attendance / Break</div>
      <label style="font-size: 0.8rem; color: var(--text-muted);">Select Punch Type:</label>
      <div class="mode-selector">
        <button class="btn-mode active" data-mode="Check-In">Check-In</button>
        <button class="btn-mode" data-mode="Break Out">Break Out</button>
        <button class="btn-mode" data-mode="Break In">Break In</button>
        <button class="btn-mode" data-mode="Check-Out">Check-Out</button>
      </div>

      <button id="btnScan" class="btn-main" disabled>Scan Face & Punch</button>
    </div>

    <!-- Date-Wise Logs & PDF Export -->
    <div class="report-card">
      <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;">
        <h2>Attendance & Break Logs</h2>
        <button id="btnExportPDF" class="btn-main" style="width: auto; padding: 0.5rem 1.2rem; background: #e11d48;">📄 Export PDF</button>
      </div>

      <!-- Filters -->
      <div class="filter-bar">
        <div>
          <label style="font-size: 0.8rem; color: var(--text-muted);">Employee:</label>
          <select id="filterUser"><option value="ALL">All Employees</option></select>
        </div>
        <div>
          <label style="font-size: 0.8rem; color: var(--text-muted);">Start Date:</label>
          <input type="date" id="filterStartDate">
        </div>
        <div>
          <label style="font-size: 0.8rem; color: var(--text-muted);">End Date:</label>
          <input type="date" id="filterEndDate">
        </div>
        <div>
          <button id="btnClearFilters" style="padding: 0.75rem; background: rgba(255,255,255,0.05); border:1px solid var(--card-border); color: #fff; border-radius: 8px; cursor: pointer;">Reset</button>
        </div>
      </div>

      <!-- Attendance Table -->
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>Employee Name</th>
              <th>Date</th>
              <th>Time</th>
              <th>Activity Type</th>
            </tr>
          </thead>
          <tbody id="attendanceTableBody">
            <tr><td colspan="4" style="text-align: center; color: var(--text-muted);">Loading logs...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Firebase Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getFirestore, collection, addDoc, getDocs, query, where, serverTimestamp 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // FIREBASE CONFIGURATION (Apni Web App keys se replace karein)
    const firebaseConfig = {
  apiKey: "AIzaSyBQnxe1gkdK67WkEBMkc-dBHrWaP1CsAlY",
  authDomain: "attandance-f7975.firebaseapp.com",
  projectId: "attandance-f7975",
  storageBucket: "attandance-f7975.firebasestorage.app",
  messagingSenderId: "444612862835",
  appId: "1:444612862835:web:0b327b1dbce181c59e5b06"
};

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // DOM Elements
    const video = document.getElementById('webcam');
    const statusDiv = document.getElementById('status');
    const btnRegister = document.getElementById('btnRegister');
    const btnScan = document.getElementById('btnScan');
    const userNameInput = document.getElementById('userName');
    const filterUser = document.getElementById('filterUser');
    const filterStartDate = document.getElementById('filterStartDate');
    const filterEndDate = document.getElementById('filterEndDate');

    let currentDescriptor = null;
    let registeredProfiles = [];
    let allLogs = [];
    let mediaStream = null;
    let selectedPunchType = "Check-In";

    // Realtime Clock
    setInterval(() => {
      document.getElementById('clock').textContent = new Date().toLocaleTimeString();
    }, 1000);

    // Punch Mode Selector Switch
    document.querySelectorAll('.btn-mode').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('.btn-mode').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        selectedPunchType = e.target.getAttribute('data-mode');
      });
    });

    // 1. Single-Instance Persistent Camera & AI Setup
    async function initSystem() {
      try {
        updateStatus("Loading AI Models...", "info");
        const MODEL_URL = 'https://justadudewhohacks.github.io/face-api.js/models';
        
        await Promise.all([
          faceapi.nets.ssdMobilenetv1.loadFromUri(MODEL_URL),
          faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
          faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)
        ]);

        updateStatus("Connecting Camera...", "info");

        // Keep persistent stream handle so camera permission isn't re-prompted
        if (!mediaStream) {
          mediaStream = await navigator.mediaDevices.getUserMedia({ 
            video: { width: { ideal: 640 }, height: { ideal: 480 }, facingMode: "user" } 
          });
          video.srcObject = mediaStream;
        }

        video.onloadedmetadata = async () => {
          await video.play();
          await loadProfiles();
          await fetchLogs();

          btnRegister.removeAttribute('disabled');
          btnScan.removeAttribute('disabled');

          updateStatus("System Ready! Face the camera.", "success");
          startDetectionLoop();
        };

      } catch (err) {
        console.error("Initialization Error:", err);
        updateStatus("Error: " + err.message, "error");
      }
    }

    // 2. Realtime Face Detection Overlay
    function startDetectionLoop() {
      const container = document.getElementById('videoContainer');
      let canvas = container.querySelector('canvas');
      
      if (!canvas) {
        canvas = faceapi.createCanvasFromMedia(video);
        container.append(canvas);
      }

      setInterval(async () => {
        if (!video.videoWidth) return;

        const displaySize = { width: video.videoWidth, height: video.videoHeight };
        faceapi.matchDimensions(canvas, displaySize);

        try {
          const detection = await faceapi.detectSingleFace(video)
            .withFaceLandmarks()
            .withFaceDescriptor();

          const ctx = canvas.getContext('2d');
          ctx.clearRect(0, 0, canvas.width, canvas.height);

          if (detection) {
            currentDescriptor = detection.descriptor;
            const resized = faceapi.resizeResults(detection, displaySize);
            faceapi.draw.drawDetections(canvas, resized);
          } else {
            currentDescriptor = null;
          }
        } catch (e) {
          console.warn("Detection Loop Warning:", e);
        }
      }, 200);
    }

    // 3. Register Profile
    btnRegister.addEventListener('click', async () => {
      const name = userNameInput.value.trim();
      if (!name) {
        alert("Enter Employee Name!");
        return;
      }
      if (!currentDescriptor) {
        alert("No face detected! Look directly into the camera.");
        return;
      }

      try {
        updateStatus("Saving profile...", "info");
        await addDoc(collection(db, "users"), {
          name: name,
          descriptor: Array.from(currentDescriptor),
          createdAt: serverTimestamp()
        });

        userNameInput.value = "";
        await loadProfiles();
        alert(`Success! ${name} registered.`);
        updateStatus(`Registered: ${name}`, "success");
      } catch (err) {
        alert("Register Error: " + err.message);
        updateStatus("Error: " + err.message, "error");
      }
    });

    // 4. Load Registered Profiles
    async function loadProfiles() {
      const snap = await getDocs(collection(db, "users"));
      registeredProfiles = [];
      filterUser.innerHTML = `<option value="ALL">All Employees</option>`;

      snap.forEach(doc => {
        const d = doc.data();
        if (d.name && d.descriptor) {
          registeredProfiles.push(new faceapi.LabeledFaceDescriptors(d.name, [new Float32Array(d.descriptor)]));
          
          const opt = document.createElement('option');
          opt.value = d.name;
          opt.textContent = d.name;
          filterUser.appendChild(opt);
        }
      });
    }

    // 5. Scan & Punch Attendance / Break
    btnScan.addEventListener('click', async () => {
      if (!currentDescriptor) {
        alert("Face not detected in camera!");
        return;
      }
      if (registeredProfiles.length === 0) {
        alert("No registered users found in Firestore!");
        return;
      }

      const matcher = new faceapi.FaceMatcher(registeredProfiles, 0.6);
      const match = matcher.findBestMatch(currentDescriptor);

      if (match.label === 'unknown') {
        updateStatus("Access Denied: Unrecognized Face!", "error");
      } else {
        await logAttendance(match.label, selectedPunchType);
      }
    });

    async function logAttendance(userName, punchType) {
      try {
        const today = new Date().toISOString().split('T')[0];
        const now = new Date();

        await addDoc(collection(db, "attendance"), {
          userName: userName,
          type: punchType,
          date: today,
          timeStr: now.toLocaleTimeString(),
          timestamp: serverTimestamp()
        });

        updateStatus(`Punched ${punchType}: ${userName}`, "success");
        await fetchLogs();
      } catch (err) {
        updateStatus("Log Error: " + err.message, "error");
      }
    }

    // 6. Fetch Logs & Render Table
    async function fetchLogs() {
      const snap = await getDocs(collection(db, "attendance"));
      allLogs = [];
      snap.forEach(doc => allLogs.push(doc.data()));
      renderTable();
    }

    function renderTable() {
      const userVal = filterUser.value;
      const startVal = filterStartDate.value;
      const endVal = filterEndDate.value;

      let filtered = allLogs.filter(log => {
        let matchUser = (userVal === "ALL" || log.userName === userVal);
        let matchStart = (!startVal || log.date >= startVal);
        let matchEnd = (!endVal || log.date <= endVal);
        return matchUser && matchStart && matchEnd;
      });

      filtered.sort((a, b) => (b.date + (b.timeStr||'')).localeCompare(a.date + (a.timeStr||'')));

      const tbody = document.getElementById('attendanceTableBody');
      tbody.innerHTML = '';

      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4" style="text-align: center; color: var(--text-muted);">No activity logs found.</td></tr>`;
        return;
      }

      filtered.forEach(item => {
        let badgeClass = "badge-checkin";
        if (item.type === "Break Out") badgeClass = "badge-breakout";
        if (item.type === "Break In") badgeClass = "badge-breakin";
        if (item.type === "Check-Out") badgeClass = "badge-checkout";

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><strong>${item.userName}</strong></td>
          <td>${item.date}</td>
          <td>${item.timeStr || 'N/A'}</td>
          <td><span class="badge ${badgeClass}">${item.type || 'Check-In'}</span></td>
        `;
        tbody.appendChild(tr);
      });
    }

    // Listeners
    filterUser.addEventListener('change', renderTable);
    filterStartDate.addEventListener('change', renderTable);
    filterEndDate.addEventListener('change', renderTable);
    document.getElementById('btnClearFilters').addEventListener('click', () => {
      filterUser.value = "ALL";
      filterStartDate.value = "";
      filterEndDate.value = "";
      renderTable();
    });

    // 7. PDF Export
    document.getElementById('btnExportPDF').addEventListener('click', () => {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();

      doc.setFontSize(16);
      doc.text("Attendance & Break Activity Report", 14, 20);
      
      doc.setFontSize(10);
      doc.text(`Employee: ${filterUser.value}`, 14, 28);
      doc.text(`Date Range: ${filterStartDate.value || 'Beginning'} to ${filterEndDate.value || 'Today'}`, 14, 34);

      const tableData = [];
      document.querySelectorAll('#attendanceTableBody tr').forEach(tr => {
        const tds = tr.querySelectorAll('td');
        if (tds.length === 4) {
          tableData.push([tds[0].innerText, tds[1].innerText, tds[2].innerText, tds[3].innerText]);
        }
      });

      doc.autoTable({
        startY: 40,
        head: [['Employee Name', 'Date', 'Time', 'Activity Type']],
        body: tableData,
      });

      doc.save(`Activity_Report_${new Date().toISOString().split('T')[0]}.pdf`);
    });

    function updateStatus(msg, type) {
      statusDiv.textContent = msg;
      statusDiv.className = `status-box ${type}`;
    }

    window.addEventListener('DOMContentLoaded', initSystem);
  </script>
</body>
</html>
