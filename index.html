<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Face ID Attendance System</title>

  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #38bdf8;
      --text: #f8fafc;
      --muted: #94a3b8;
      --success: #22c55e;
      --danger: #ef4444;
      --border: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 1.5rem; }

    .header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 1.5rem; border-bottom: 1px solid var(--border); padding-bottom: 1rem;
    }
    h1 { font-size: 1.5rem; color: var(--accent); }

    .grid { display: grid; grid-template-columns: 1fr 380px; gap: 1.5rem; }
    @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }

    .video-container {
      position: relative; background: #000; border-radius: 12px;
      overflow: hidden; aspect-ratio: 4/3; box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    video, canvas { position: absolute; top:0; left:0; width:100%; height:100%; object-fit: cover; }

    .panel {
      background: var(--card); padding: 1.25rem; border-radius: 12px;
      display: flex; flex-direction: column; gap: 1rem; border: 1px solid var(--border);
    }

    input, select, button {
      width: 100%; padding: 0.65rem; border-radius: 6px;
      border: 1px solid var(--border); background: #0f172a; color: var(--text); font-size: 0.9rem;
    }

    button { background: var(--accent); color: #0f172a; font-weight: 600; cursor: pointer; border: none; }
    button:hover { opacity: 0.9; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }

    .btn-pdf { background: #e11d48; color: #fff; }

    .status-box {
      padding: 0.6rem; border-radius: 6px; font-size: 0.85rem; text-align: center; background: #334155;
    }
    .status-box.success { background: rgba(34,197,94,0.2); color: var(--success); border: 1px solid var(--success); }
    .status-box.error { background: rgba(239,68,68,0.2); color: var(--danger); border: 1px solid var(--danger); }

    /* Report Section */
    .report-section {
      grid-column: 1 / -1; background: var(--card); padding: 1.5rem;
      border-radius: 12px; margin-top: 1.5rem; border: 1px solid var(--border);
    }

    .filter-bar {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 1rem; margin: 1rem 0; align-items: end;
    }

    .table-wrapper { overflow-x: auto; margin-top: 1rem; }
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.9rem; }
    th, td { padding: 0.75rem; border-bottom: 1px solid var(--border); }
    th { background: #0f172a; color: var(--muted); }
  </style>

  <!-- Required JS Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
</head>
<body>

  <div class="header">
    <h1>Face ID Attendance System</h1>
    <div id="clock" style="color: var(--muted); font-size: 0.9rem;"></div>
  </div>

  <div class="grid">
    <!-- Camera Viewport -->
    <div class="video-container">
      <video id="webcam" autoplay muted playsinline></video>
    </div>

    <!-- Registration & Action Controls -->
    <div class="panel">
      <div id="status" class="status-box">Initializing models & camera...</div>

      <h3>1. Register Employee Face</h3>
      <input type="text" id="userName" placeholder="Enter Full Name">
      <button id="btnRegister" disabled>Register Face</button>

      <hr style="border-color: var(--border);">

      <h3>2. Daily Attendance</h3>
      <button id="btnScan" disabled>Scan Face & Mark Attendance</button>
    </div>

    <!-- Date-Wise Attendance Reports -->
    <div class="report-section">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <h2>Date-Wise Attendance Report</h2>
        <button id="btnExportPDF" class="btn-pdf" style="width: auto; padding: 0.5rem 1.2rem;">📄 Export PDF</button>
      </div>

      <!-- Filters -->
      <div class="filter-bar">
        <div>
          <label style="font-size: 0.8rem; color: var(--muted);">Employee Filter:</label>
          <select id="filterUser"><option value="ALL">All Employees</option></select>
        </div>
        <div>
          <label style="font-size: 0.8rem; color: var(--muted);">Start Date:</label>
          <input type="date" id="filterStartDate">
        </div>
        <div>
          <label style="font-size: 0.8rem; color: var(--muted);">End Date:</label>
          <input type="date" id="filterEndDate">
        </div>
        <div>
          <button id="btnClearFilters" style="background:#334155; color:#fff;">Reset Filters</button>
        </div>
      </div>

      <!-- Logs Table -->
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>Employee Name</th>
              <th>Date</th>
              <th>Check-in Time</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="attendanceTableBody">
            <tr><td colspan="4" style="text-align: center; color: var(--muted);">Loading logs...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Firebase Modular Integration Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getFirestore, collection, addDoc, getDocs, query, where, serverTimestamp 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // 1. Firebase Configuration (UPDATE WITH YOUR FIREBASE KEYS)
    const firebaseConfig = {
  apiKey: "AIzaSyBQnxe1gkdK67WkEBMkc-dBHrWaP1CsAlY",
  authDomain: "attandance-f7975.firebaseapp.com",
  projectId: "attandance-f7975",
  storageBucket: "attandance-f7975.firebasestorage.app",
  messagingSenderId: "444612862835",
  appId: "1:444612862835:web:0b327b1dbce181c59e5b06"
};

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // DOM Elements
    const video = document.getElementById('webcam');
    const statusDiv = document.getElementById('status');
    const btnRegister = document.getElementById('btnRegister');
    const btnScan = document.getElementById('btnScan');
    const userNameInput = document.getElementById('userName');
    const filterUser = document.getElementById('filterUser');
    const filterStartDate = document.getElementById('filterStartDate');
    const filterEndDate = document.getElementById('filterEndDate');

    let currentDescriptor = null;
    let registeredProfiles = [];
    let allLogs = [];
    let detectionInterval = null;

    // Live Clock
    setInterval(() => {
      document.getElementById('clock').textContent = new Date().toLocaleString();
    }, 1000);

    // 2. Initialize Neural Networks and Webcam
    async function initSystem() {
      try {
        updateStatus("Loading face recognition models...", "info");
        
        // Load Model files from CDN
        const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model';
        await Promise.all([
          faceapi.nets.ssdMobilenetv1.loadFromUri(MODEL_URL),
          faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
          faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)
        ]);

        updateStatus("Requesting Camera Access...", "info");
        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
        video.srcObject = stream;

        // Clean event handling to prevent camera blinking bug
        video.onloadedmetadata = async () => {
          video.play();
          await loadProfiles();
          await fetchLogs();

          btnRegister.disabled = false;
          btnScan.disabled = false;
          updateStatus("System Active & Ready", "success");

          startDetectionLoop();
        };

      } catch (err) {
        console.error(err);
        updateStatus("Error: " + err.message + " (Check localhost or HTTPS URL)", "error");
      }
    }

    // 3. Continuous Detection Loop (No Stacking Canvas)
    function startDetectionLoop() {
      if (detectionInterval) clearInterval(detectionInterval);

      const videoContainer = document.querySelector('.video-container');
      const existingCanvas = videoContainer.querySelector('canvas');
      if (existingCanvas) existingCanvas.remove();

      const canvas = faceapi.createCanvasFromMedia(video);
      videoContainer.append(canvas);

      detectionInterval = setInterval(async () => {
        if (video.videoWidth === 0 || video.videoHeight === 0) return;

        const displaySize = { width: video.videoWidth, height: video.videoHeight };
        faceapi.matchDimensions(canvas, displaySize);

        try {
          const detection = await faceapi.detectSingleFace(video)
            .withFaceLandmarks()
            .withFaceDescriptor();

          const ctx = canvas.getContext('2d');
          ctx.clearRect(0, 0, canvas.width, canvas.height);

          if (detection) {
            currentDescriptor = detection.descriptor;
            const resized = faceapi.resizeResults(detection, displaySize);
            faceapi.draw.drawDetections(canvas, resized);
          } else {
            currentDescriptor = null;
          }
        } catch (e) {
          console.warn("Frame read error:", e);
        }
      }, 250);
    }

    // 4. Save Face Descriptors to Firestore
    btnRegister.addEventListener('click', async () => {
      const name = userNameInput.value.trim();
      if (!name) return alert("Please enter employee full name.");
      if (!currentDescriptor) return alert("Face not detected. Stand directly in front of camera.");

      try {
        updateStatus("Registering face profile...", "info");
        await addDoc(collection(db, "users"), {
          name: name,
          descriptor: Array.from(currentDescriptor),
          createdAt: serverTimestamp()
        });

        userNameInput.value = "";
        await loadProfiles();
        updateStatus(`Employee "${name}" registered successfully!`, "success");
      } catch (err) {
        updateStatus("Register Error: " + err.message, "error");
      }
    });

    // 5. Load Registered Face Descriptors
    async function loadProfiles() {
      const snap = await getDocs(collection(db, "users"));
      registeredProfiles = [];
      filterUser.innerHTML = `<option value="ALL">All Employees</option>`;

      snap.forEach(doc => {
        const d = doc.data();
        if (d.name && d.descriptor) {
          registeredProfiles.push(new faceapi.LabeledFaceDescriptors(d.name, [new Float32Array(d.descriptor)]));
          
          const opt = document.createElement('option');
          opt.value = d.name;
          opt.textContent = d.name;
          filterUser.appendChild(opt);
        }
      });
    }

    // 6. Face Match and Attendance Action
    btnScan.addEventListener('click', async () => {
      if (!currentDescriptor) return alert("No face visible in camera!");
      if (registeredProfiles.length === 0) return alert("No registered employees found in Firestore.");

      const matcher = new faceapi.FaceMatcher(registeredProfiles, 0.6);
      const match = matcher.findBestMatch(currentDescriptor);

      if (match.label === 'unknown') {
        updateStatus("Access Denied: Unrecognized Face!", "error");
      } else {
        await logAttendance(match.label);
      }
    });

    // 7. Prevent Duplicate Log and Add to DB
    async function logAttendance(userName) {
      try {
        const today = new Date().toISOString().split('T')[0];

        // Check if employee already logged in today
        const q = query(collection(db, "attendance"), where("userName", "==", userName), where("date", "==", today));
        const checkSnap = await getDocs(q);

        if (!checkSnap.empty) {
          updateStatus(`Already checked in today: ${userName}`, "error");
          return;
        }

        const now = new Date();
        await addDoc(collection(db, "attendance"), {
          userName: userName,
          date: today,
          timeStr: now.toLocaleTimeString(),
          timestamp: serverTimestamp()
        });

        updateStatus(`Attendance Marked: ${userName}`, "success");
        await fetchLogs();
      } catch (err) {
        updateStatus("Attendance Error: " + err.message, "error");
      }
    }

    // 8. Fetch and Date-Wise Filter Report
    async function fetchLogs() {
      const snap = await getDocs(collection(db, "attendance"));
      allLogs = [];
      snap.forEach(doc => allLogs.push(doc.data()));
      renderTable();
    }

    function renderTable() {
      const userVal = filterUser.value;
      const startVal = filterStartDate.value;
      const endVal = filterEndDate.value;

      let filtered = allLogs.filter(log => {
        let matchUser = (userVal === "ALL" || log.userName === userVal);
        let matchStart = (!startVal || log.date >= startVal);
        let matchEnd = (!endVal || log.date <= endVal);
        return matchUser && matchStart && matchEnd;
      });

      filtered.sort((a, b) => (b.date + b.timeStr).localeCompare(a.date + a.timeStr));

      const tbody = document.getElementById('attendanceTableBody');
      tbody.innerHTML = '';

      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4" style="text-align: center; color: var(--muted);">No matching attendance logs found.</td></tr>`;
        return;
      }

      filtered.forEach(item => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><strong>${item.userName}</strong></td>
          <td>${item.date}</td>
          <td>${item.timeStr || 'N/A'}</td>
          <td><span style="color:var(--success); font-weight:bold;">Present</span></td>
        `;
        tbody.appendChild(tr);
      });
    }

    // Filter Change Listeners
    filterUser.addEventListener('change', renderTable);
    filterStartDate.addEventListener('change', renderTable);
    filterEndDate.addEventListener('change', renderTable);
    document.getElementById('btnClearFilters').addEventListener('click', () => {
      filterUser.value = "ALL";
      filterStartDate.value = "";
      filterEndDate.value = "";
      renderTable();
    });

    // 9. Export PDF Report
    document.getElementById('btnExportPDF').addEventListener('click', () => {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();

      doc.setFontSize(16);
      doc.text("Date-Wise Attendance Report", 14, 20);
      
      doc.setFontSize(10);
      doc.text(`Employee Filter: ${filterUser.value}`, 14, 28);
      doc.text(`Date Range: ${filterStartDate.value || 'Beginning'} to ${filterEndDate.value || 'Today'}`, 14, 34);

      const tableData = [];
      document.querySelectorAll('#attendanceTableBody tr').forEach(tr => {
        const tds = tr.querySelectorAll('td');
        if (tds.length === 4) {
          tableData.push([tds[0].innerText, tds[1].innerText, tds[2].innerText, tds[3].innerText]);
        }
      });

      doc.autoTable({
        startY: 40,
        head: [['Employee Name', 'Date', 'Time', 'Status']],
        body: tableData,
      });

      doc.save(`Attendance_Report_${new Date().toISOString().split('T')[0]}.pdf`);
    });

    function updateStatus(msg, type) {
      statusDiv.textContent = msg;
      statusDiv.className = `status-box ${type}`;
    }

    // Single initialization on Page Load
    window.addEventListener('DOMContentLoaded', initSystem);
  </script>
</body>
</html>
